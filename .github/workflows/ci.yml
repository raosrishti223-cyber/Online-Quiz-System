
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f ONLINE_QUIZ_SYSTEM_FINAL_SPRINT1/package.json
          test -f ONLINE_QUIZ_SYSTEM_FINAL_SPRINT2/package.json
          echo "Project files verified successfully"
